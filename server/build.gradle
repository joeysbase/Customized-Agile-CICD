plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'

    // Use jacoco for test coverage.
    id 'jacoco'

    // Use checkstyle
    id 'checkstyle'

    id 'pmd'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava

    // implementation "io.github.joeysbase:time-duration:0.1.0"

    // implementation "com.github.spotbugs:com.github.spotbugs.gradle.plugin:6.4.8"

    implementation 'info.picocli:picocli:4.7.7'

    implementation 'org.yaml:snakeyaml:2.2'

    // implementation 'com.google.code.gson:gson:2.13.2'

    // implementation 'de.vandermeer:asciitable:0.3.2'

    checkstyle "com.puppycrawl.tools:checkstyle:${checkstyle.toolVersion}"
    implementation 'org.mongodb:mongodb-driver-sync:4.11.1'
    implementation "com.github.docker-java:docker-java:3.7.1"
    implementation "com.github.docker-java:docker-java-transport-httpclient5:3.7.1"
    implementation 'javax.ws.rs:javax.ws.rs-api:2.1.1'
    implementation 'io.kubernetes:client-java:21.0.0'

    // Prometheus metrics
    implementation 'io.prometheus:simpleclient:0.16.0'
    implementation 'io.prometheus:simpleclient_common:0.16.0'
    implementation 'io.prometheus:simpleclient_hotspot:0.16.0'

    // Structured JSON logging
    implementation 'ch.qos.logback:logback-classic:1.4.14'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
    implementation 'org.slf4j:jul-to-slf4j:2.0.9'

    // OTel (logs now, traces in #114)
    implementation platform('io.opentelemetry:opentelemetry-bom:1.43.0')
    implementation platform('io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha:2.9.0-alpha')
    implementation 'io.opentelemetry:opentelemetry-api'
    implementation 'io.opentelemetry:opentelemetry-sdk'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.opentelemetry:opentelemetry-sdk-logs'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0'
}

jar {
    archiveClassifier = "all"

    manifest {
        attributes(
                "Main-Class": application.mainClass
        )
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude("META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA")

    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}


checkstyle {
    toolVersion = "10.12.5"
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
}

pmd {
    consoleOutput = true
    toolVersion = "7.16.0"
    rulesMinimumPriority = 5
    ignoreFailures = true
    // ruleSets = ["category/java/errorprone.xml", "category/java/bestpractices.xml"]
}

jacoco {
    toolVersion = "0.8.14"
    reportsDirectory = layout.buildDirectory.dir('customJacocoReportDir')
}

test {
    finalizedBy jacocoTestReport // report is always generated after tests run
}

jacocoTestReport.outputs.upToDateWhen { false }

jacocoTestReport {
    dependsOn test // tests are required to run before generating the report

    reports {
        xml.required = false
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/DockerJobExecutor*',
                '**/KubernetesJobExecutor*',
                '**/DataStoreAgent*',
                '**/ReportService*',
                '**/ReportWorker*',
                '**/RunWorker*',
                '**/engine/git/**',
                '**/JobScheduler*',
                '**/RunHandler*',
                '**/ReportHandler*',
                '**/PipelineRouter*',
                '**/ServerMain*',
                '**/ServerAgent*',
                '**/MetricsRegistry*',
                '**/MetricsHandler*',
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn test

    violationRules {
        rule {
            limit {
                minimum = 0.70
            }
        }
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/DockerJobExecutor*',
                '**/KubernetesJobExecutor*',
                '**/DataStoreAgent*',
                '**/ReportService*',
                '**/ReportWorker*',
                '**/RunWorker*',
                '**/engine/git/**',
                '**/JobScheduler*',
                '**/RunHandler*',
                '**/ReportHandler*',
                '**/PipelineRouter*',
                '**/ServerMain*',
                '**/ServerAgent*',
                '**/MetricsRegistry*',
                '**/MetricsHandler*',
            ])
        }))
    }
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'fteam.server.ServerMain'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
