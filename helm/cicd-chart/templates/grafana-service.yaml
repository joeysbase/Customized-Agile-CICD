apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-grafana-service
spec:
  type: {{ .Values.grafana.service.type }}
  selector:
    app: {{ .Release.Name }}-grafana
  ports:
    - port: {{ .Values.grafana.service.port }}
      targetPort: 3000
      nodePort: {{ .Values.grafana.service.nodePort }}
