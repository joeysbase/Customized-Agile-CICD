apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-cicd-server-service
spec:
  type: {{ .Values.server.service.type }}
  selector:
    app: {{ .Release.Name }}-cicd-server
  ports:
    - port: {{ .Values.server.service.port }}
      targetPort: 8080
      nodePort: {{ .Values.server.service.nodePort }}