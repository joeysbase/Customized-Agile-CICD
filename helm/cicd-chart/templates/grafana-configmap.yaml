apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-config
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ .Release.Name }}-prometheus-service:{{ .Values.prometheus.service.port }}
        isDefault: true
        editable: false
      - name: Loki
        type: loki
        access: proxy
        url: http://{{ .Release.Name }}-loki-service:{{ .Values.loki.service.port }}
        editable: false
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://{{ .Release.Name }}-tempo-service:{{ .Values.tempo.service.httpPort }}
        editable: false
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: "default"
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
