apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-otel-collector-service
spec:
  selector:
    app: {{ .Release.Name }}-otel-collector
  ports:
    - name: grpc
      port: {{ .Values.otelCollector.service.grpcPort }}
      targetPort: 4317
    - name: http
      port: {{ .Values.otelCollector.service.httpPort }}
      targetPort: 4318
